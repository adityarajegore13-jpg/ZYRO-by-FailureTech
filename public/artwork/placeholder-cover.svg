<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="50%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="url(#glowGrad)" />

  <!-- Subtle vinyl groove rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.4" />
  <circle cx="200" cy="200" r="90" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.3" />

  <!-- Center Vinyl Hub -->
  <circle cx="200" cy="200" r="54" fill="#0A0D14" stroke="#1E293B" stroke-width="2" />

  <!-- Stylized Music Symbol -->
  <g transform="translate(180, 172)" fill="url(#neonGrad)">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h14v6.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V3H12z" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="200" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#64748B">
    ZYRO MUSIC HUB
  </text>
  <text x="200" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" letter-spacing="1.5" fill="#475569">
    OFFICIAL ARCHIVE
  </text>
</svg>
